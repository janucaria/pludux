<!doctype html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no" />
  <meta name="application-name" content="Pludux">
  <meta name="description" content="Appliction for backtesting trading strategies">
  <meta name="author" content="Januar Andaria">
  <title>Pludux</title>
  <style>
    body {
      margin: 0;
      background-color: #0e1014;
      color: #eef1f7;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .emscripten {
      position: absolute;
      top: 0px;
      left: 0px;
      margin: 0px;
      border: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: block;
      image-rendering: optimizeSpeed;
      image-rendering: -moz-crisp-edges;
      image-rendering: -o-crisp-edges;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: optimize-contrast;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      -ms-interpolation-mode: nearest-neighbor;
    }

    #loading-overlay {
      align-items: center;
      background: #0e1014;
      display: flex;
      inset: 0;
      justify-content: center;
      opacity: 1;
      pointer-events: none;
      position: fixed;
      transition: opacity 180ms ease-out;
      z-index: 1;
    }

    #loading-overlay.loading-overlay-hidden {
      opacity: 0;
    }

    .loading-content {
      align-items: center;
      display: flex;
      flex-direction: column;
    }

    .loading-title {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.08em;
      margin-bottom: 27px;
    }

    .loading-spinner {
      animation: loading-spin 850ms linear infinite;
      border: 3px solid #303642;
      border-radius: 50%;
      border-top-color: #5e81f4;
      box-sizing: border-box;
      height: 25px;
      margin-bottom: 22px;
      width: 25px;
    }

    .loading-detail {
      color: #97a0b0;
      font-size: 13px;
    }

    @keyframes loading-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()"></canvas>
  <div id="loading-overlay" role="status" aria-live="polite">
    <div class="loading-content">
      <div class="loading-title">PLUDUX</div>
      <div class="loading-spinner" aria-hidden="true"></div>
      <div class="loading-detail">Preparing your workspace...</div>
    </div>
  </div>
  <script type='text/javascript'>
    var Module;
    (async () => {
      Module = {
        preRun: [],
        postRun: [],
        print: (function () {
          return function (text) {
            text = Array.prototype.slice.call(arguments).join(' ');
            console.log(text);
          };
        })(),
        printErr: function (text) {
          text = Array.prototype.slice.call(arguments).join(' ');
          console.error(text);
        },
        canvas: (function () {
          var canvas = document.getElementById('canvas');
          //canvas.addEventListener("webglcontextlost", function(e) { alert('FIXME: WebGL context lost, please reload the page'); e.preventDefault(); }, false);
          return canvas;
        })(),
        setStatus: function (text) {
          console.log("status: " + text);
        },
        monitorRunDependencies: function (left) {
          // no run dependencies to log
        }
      };

      window.onerror = function () {
        console.log("onerror: " + event);
      };

      // Initialize the graphics adapter
      {
        if (!navigator.gpu) {
          throw Error("WebGPU not supported.");
        }

        const adapter = await navigator.gpu.requestAdapter();
        const device = await adapter.requestDevice();
        Module.preinitializedWebGPUDevice = device;
      }

      {
        const js = document.createElement('script');
        js.async = true;
        js.src = "index.js";
        document.body.appendChild(js);
      }
    })();
  </script>
</body>

</html>
